name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest

  package-web:
    needs:
      - verify-frontend
      - verify-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create static web package
        shell: bash
        run: |
          archive_name="cantonese-biz-${GITHUB_REF_NAME}-web.zip"
          (
            cd dist
            zip -r "../${archive_name}" .
          )
          sha256sum "${archive_name}" > "${archive_name}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: |
            cantonese-biz-${{ github.ref_name }}-web.zip
            cantonese-biz-${{ github.ref_name }}-web.zip.sha256
          if-no-files-found: error
          retention-days: 14

  package-containers:
    needs:
      - verify-frontend
      - verify-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            image_suffix: ""
          - component: api
            context: ./backend
            image_suffix: "-api"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
          labels: |
            org.opencontainers.image.title=CantoneseBiz ${{ matrix.component }}
            org.opencontainers.image.description=Firebird 2026 Hong Kong business Cantonese training platform
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  release:
    needs:
      - package-web
      - package-containers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-web
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          name: CantoneseBiz ${{ github.ref_name }}
          body: |
            粤商通 CantoneseBiz 的首个正式参赛版本。

            ### 下载
            - `cantonese-biz-${{ github.ref_name }}-web.zip`：可直接部署的静态 Web 包
            - `cantonese-biz-${{ github.ref_name }}-web.zip.sha256`：完整性校验

            ### GitHub Container Registry
            - `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}`

            容器镜像同时发布语义版本、主次版本、主版本与 `latest` 标签。
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
