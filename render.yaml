services:
  - type: web
    name: cantonese-biz-api
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: public-budget
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: AI_SCENE_PROVIDER
        value: deepseek
      - key: AI_LOCALIZE_PROVIDER
        value: hkchat
      - key: ALLOW_OFFLINE_FALLBACK
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HKCHAT_API_KEY
        sync: false
      - key: PUBLIC_REQUIRE_DUAL_MODEL
        value: "true"
      - key: PUBLIC_AI_BUDGET_CNY
        value: "5"
      - key: PUBLIC_AI_ESTIMATED_TURN_COST_CNY
        value: "0.05"
      - key: PUBLIC_AI_TURNS_PER_CLIENT
        value: "5"
      - key: PUBLIC_AI_BUDGET_DB_PATH
        value: /app/data/public_api_budget.sqlite3
      - key: PUBLIC_AI_CLIENT_HASH_SALT
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://dragon-zhang-woo.github.io
      - key: FORWARDED_ALLOW_IPS
        value: "*"
